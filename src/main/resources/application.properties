spring.application.name=soulspace
server.port=${PORT:8090}
server.error.include-message=always
server.error.include-binding-errors=never
server.compression.enabled=true

# Database: persistent file-based H2 locally; set SPRING_DATASOURCE_URL (jdbc:postgresql://...) for PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/soulspace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SOULSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Reviews may only be left by people who booked that clinician (set false to allow any signed-in user)
soulspace.reviews.require-booking=${REVIEWS_REQUIRE_BOOKING:true}

# Gemini AI configuration for Aria
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3-flash-preview}

